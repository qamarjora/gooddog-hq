<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#093023">
<title>Good Dog HQ · Регламенты смены</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#093023; --gm:#0d4a32; --y:#f5c518;
  --white:#fff; --bg:#f6f6f3;
  --text:#1a1a1a; --mu:#8a8f8b;
  --bd:rgba(9,48,35,.1); --dv:#ededea;
  --shadow:0 2px 10px rgba(9,48,35,.07);
  --shadow-h:0 6px 20px rgba(9,48,35,.13);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

header{
  background:var(--white);border-bottom:1.5px solid var(--bd);
  height:60px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;position:sticky;top:0;z-index:50;
}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer}
.brand img{height:30px;display:block}
.hq{background:var(--g);color:var(--y);font-size:12px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:6px}

main{padding:24px 16px 60px;max-width:600px;margin:0 auto}

/* HOME */
.home-head{margin-bottom:22px}
.home-head h1{font-size:22px;font-weight:800;color:var(--g);margin-bottom:3px}
.home-head p{font-size:13px;color:var(--mu)}

.role-group{margin-bottom:22px}
.role-label{
  display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;
  color:var(--g);text-transform:uppercase;letter-spacing:.05em;margin-bottom:11px;padding-left:2px;
}
.role-label .ic{font-size:17px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{
  background:var(--white);border:1.5px solid var(--bd);border-radius:15px;
  padding:18px 16px;cursor:pointer;transition:.18s;text-align:left;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;min-height:104px;justify-content:space-between;
}
.tile:hover{border-color:var(--g);box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tile:active{transform:translateY(0)}
.tile-badge{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;
}
.tile-badge.open{background:rgba(245,197,24,.18)}
.tile-badge.close{background:rgba(9,48,35,.08)}
.tile-name{font-size:15px;font-weight:800;color:var(--g)}
.tile-sub{font-size:12px;color:var(--mu);font-weight:600;margin-top:2px}

.tile-wide{
  grid-column:1 / -1;flex-direction:row;align-items:center;gap:14px;min-height:0;padding:16px 18px;
}
.tile-wide .tile-badge{background:rgba(9,48,35,.08);flex-shrink:0}
.tile-wide .arrow{margin-left:auto;color:var(--mu);font-size:22px}

/* DOC */
.doc-view{display:none}
.doc-view.active{display:block}
.home-view.hidden{display:none}
.btn-back{
  background:var(--white);border:1.5px solid var(--bd);color:var(--text);
  padding:9px 15px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;
  cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;
}
.btn-back:hover{border-color:var(--g);color:var(--g)}
.doc-title{
  display:flex;align-items:baseline;gap:10px;padding:2px 4px 18px;
  border-bottom:2px solid var(--g);margin-bottom:22px;
}
.doc-title h1{font-size:22px;font-weight:800;color:var(--g);letter-spacing:-.01em}
.doc-title .role-tag{font-size:14px;font-weight:700;color:var(--mu)}

.block{margin-bottom:26px}
.block-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.block-num{
  width:26px;height:26px;border-radius:8px;background:var(--g);color:var(--y);
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.block-title{font-size:16px;font-weight:800;color:var(--g)}
.block ul{list-style:none;padding-left:36px}
.block li{
  position:relative;font-size:15px;line-height:1.55;font-weight:500;color:var(--text);
  padding:7px 0;border-bottom:1px solid var(--dv);
}
.block li:last-child{border-bottom:none}
.block li::before{content:'';position:absolute;left:-18px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--y)}

.foot{text-align:center;color:var(--mu);font-size:12px;font-weight:600;padding:10px 0 0;border-top:1px solid var(--dv);margin-top:30px}

@media print{
  header{position:static}
  .btn-back{display:none}
  body{background:#fff}
}
@media (max-width:600px){
  .doc-title h1{font-size:20px}
  .block-title{font-size:15px}
  .block li{font-size:14.5px}
}
</style>
</head>

const roleName={cook:'Повар',barista:'Бариста-кассир'};
const modeName={open:'Открытие',close:'Закрытие'};

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function buildDoc(blocks,title,tag,footRole){
  let html='<div class="doc-title"><h1>'+title+'</h1><span class="role-tag">'+tag+'</span></div>';
  blocks.forEach((b,i)=>{
    html+='<div class="block"><div class="block-head"><div class="block-num">'+(i+1)+'</div><div class="block-title">'+esc(b[0])+'</div></div><ul>';
    b[1].forEach(item=>{html+='<li>'+esc(item)+'</li>'});
    html+='</ul></div>';
  });
  html+='<div class="foot">Good Dog · '+footRole+' · '+title.toLowerCase()+'</div>';
  return html;
}

function showDoc(){
  document.getElementById('homeView').classList.add('hidden');
  document.getElementById('docView').classList.add('active');
  window.scrollTo(0,0);
}
function openDoc(role,mode){
  document.getElementById('docBody').innerHTML=buildDoc(DATA[role][mode],modeName[mode],roleName[role],roleName[role].toLowerCase());
  showDoc();
}
function openRules(){
  document.getElementById('docBody').innerHTML=buildDoc(DATA.rules,'Общие правила','Все сотрудники','все сотрудники');
  showDoc();
}
function goHome(){
  document.getElementById('docView').classList.remove('active');
  document.getElementById('homeView').classList.remove('hidden');
  window.scrollTo(0,0);
}
