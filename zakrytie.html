<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#093023">
<title>Закрытие смены — Good Dog</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#093023; --gm:#0d4a32; --y:#ffcc00; --white:#fff; --bg:#f8f8f6;
  --text:#1a1a1a; --mu:#888; --bd:rgba(9,48,35,0.12); --dv:#efefeb;
  --ibg:#fafaf8; --red:#e24b4a; --radius:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow-x:hidden;}
body{font-family:'Manrope',sans-serif;background:var(--white);color:var(--text);-webkit-font-smoothing:antialiased;}
header{background:var(--g);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;}
.logo-bars{display:flex;gap:3px;align-items:flex-end;}
.logo-bars span{display:block;width:4px;background:var(--y);border-radius:2px;}
.logo-bars span:nth-child(1){height:12px;}.logo-bars span:nth-child(2){height:18px;}
.logo-bars span:nth-child(3){height:22px;}.logo-bars span:nth-child(4){height:18px;}
.logo-bars span:nth-child(5){height:12px;}
.logo-text{color:var(--white);font-size:14px;font-weight:800;letter-spacing:.05em;}
.logo-text span{color:var(--y);}
.back-link{color:rgba(255,255,255,.7);font-size:13px;font-weight:600;text-decoration:none;}
.back-link:hover{color:var(--y);}
main{max-width:520px;margin:0 auto;padding:20px 14px 90px;}
h1.page-title{font-size:20px;font-weight:800;color:var(--g);margin-bottom:4px;}
.subtitle{color:var(--mu);font-size:13px;margin-bottom:18px;}
.tabs{display:flex;gap:0;margin-bottom:18px;border:1.5px solid var(--bd);border-radius:10px;overflow:hidden;}
.tab{flex:1;padding:11px;background:var(--white);border:none;font-family:'Manrope',sans-serif;font-size:14px;font-weight:700;color:var(--mu);cursor:pointer;transition:all .2s;}
.tab.active{background:var(--g);color:var(--white);}
.form{display:none;flex-direction:column;gap:12px;}
.form.active{display:flex;}
.card{background:var(--white);border:1.5px solid var(--bd);border-radius:16px;padding:14px 16px;box-shadow:0 1px 4px rgba(9,48,35,.05);}
.card-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.group-label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:10px 0 6px;}
.dt-row{display:flex;gap:8px;}
.dt-inp{flex:1;font-size:14px;font-family:'Manrope',sans-serif;border:.5px solid var(--bd);border-radius:10px;padding:9px 12px;background:var(--ibg);color:var(--text);outline:none;}
.dt-inp:focus{border-color:var(--g);}
.name-field{display:flex;align-items:center;gap:6px;padding:8px 0;}
.nf-label{font-size:12px;color:var(--mu);width:60px;flex-shrink:0;}
.nf-inp{flex:1;font-size:14px;font-family:'Manrope',sans-serif;border:none;border-bottom:1px solid var(--bd);background:transparent;color:var(--text);outline:none;padding:2px 0;}
.nf-inp:focus{border-color:var(--g);}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid var(--dv);}
.row:last-of-type{border-bottom:none;}
.row-name{font-size:13px;font-weight:500;color:var(--text);flex:1;min-width:0;}
.pid-badge{font-size:9px;color:var(--g);background:rgba(9,48,35,.07);border-radius:5px;padding:2px 5px;font-weight:700;}
.num-inp{width:60px;font-size:13px;font-family:'Manrope',sans-serif;border:.5px solid var(--bd);border-radius:8px;padding:6px 7px;text-align:right;background:var(--ibg);color:var(--text);outline:none;-moz-appearance:textfield;}
.num-inp::-webkit-outer-spin-button,.num-inp::-webkit-inner-spin-button{-webkit-appearance:none;}
.num-inp:focus{border-color:var(--g);}
.unit{font-size:11px;color:var(--mu);width:34px;flex-shrink:0;}
.wo-row{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
.wo-sel{flex:1;font-size:13px;font-family:'Manrope',sans-serif;border:1px solid var(--bd);border-radius:8px;padding:8px 9px;background:var(--white);color:var(--text);outline:none;min-width:0;}
.wo-sel:focus{border-color:var(--g);}
.wo-num{width:52px;font-size:13px;font-family:'Manrope',sans-serif;border:1px solid var(--bd);border-radius:8px;padding:7px;text-align:right;background:var(--ibg);color:var(--text);outline:none;-moz-appearance:textfield;}
.wo-num::-webkit-outer-spin-button,.wo-num::-webkit-inner-spin-button{-webkit-appearance:none;}
.wo-del{border:none;background:transparent;color:#b45309;cursor:pointer;font-size:18px;line-height:1;padding:0 4px;flex-shrink:0;}
.add-btn{width:100%;margin-top:8px;padding:9px;font-size:13px;font-family:'Manrope',sans-serif;font-weight:600;color:var(--g);background:rgba(9,48,35,.05);border:1px dashed rgba(9,48,35,.25);border-radius:10px;cursor:pointer;}
.add-btn:active{background:rgba(9,48,35,.1);}
.sausage-box{margin-top:12px;padding:12px;background:var(--ibg);border:1px solid var(--bd);border-radius:12px;}
.sausage-title{font-size:11px;font-weight:700;color:var(--g);margin-bottom:8px;}
.hint{font-size:11px;color:var(--mu);text-align:center;margin-top:6px;}
.hint.warn{color:var(--red);font-weight:600;}
.wo-inp{width:100%;font-size:13px;font-family:'Manrope',sans-serif;border:.5px solid var(--bd);border-radius:10px;padding:9px 12px;background:var(--ibg);color:var(--text);outline:none;margin-bottom:7px;display:block;}
.wo-inp:focus{border-color:var(--g);}
.send-btn{width:100%;padding:15px;background:var(--g);color:var(--y);border:none;border-radius:14px;font-size:15px;font-weight:700;font-family:'Manrope',sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;margin-top:4px;}
.send-btn:active{transform:scale(.98);}
.send-btn:disabled{opacity:.6;}
.send-btn svg{width:22px;height:22px;flex-shrink:0;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--g);color:var(--white);padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:300;transition:transform .3s;max-width:92%;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.error{background:var(--red);}

.cl-note{font-size:11px;color:var(--mu);margin-bottom:8px;line-height:1.4;}
.cl-cat{border-bottom:1px solid var(--dv);}
.cl-head{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;padding:11px 2px;font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;color:var(--g);cursor:pointer;}
.cl-head .cl-cnt{font-size:11px;color:var(--y);background:var(--g);border-radius:10px;padding:1px 7px;margin-left:auto;margin-right:8px;display:none;}
.cl-head .cl-cnt.on{display:inline-block;}
.cl-arrow{color:var(--mu);font-size:12px;}
.cl-body{padding:2px 0 8px;}
.cl-row{display:flex;align-items:center;gap:9px;padding:7px 2px;cursor:pointer;}
.cl-check{width:19px;height:19px;flex-shrink:0;accent-color:var(--g);cursor:pointer;}
.cl-name{flex:1;font-size:13px;color:var(--text);}
.cl-min{font-size:11px;color:var(--mu);flex-shrink:0;text-align:right;}
</style>
</head>

function checklistHTML(role){
  return CHECKLIST[role].map(function(cat,ci){
    const cid = role+'-cat-'+ci;
    const rows = cat.items.map(function(it){
      return '<label class="cl-row"><input type="checkbox" class="cl-check" data-name="'+esc(it.n)+'" onchange="catCount(\''+cid+'\')">'+
             '<span class="cl-name">'+esc(it.n)+'</span>'+
             '<span class="cl-min">'+esc(it.m||'')+'</span></label>';
    }).join('');
    return '<div class="cl-cat">'+
      '<button type="button" class="cl-head" onclick="toggleCat(\''+cid+'\')">'+
        '<span>'+esc(cat.cat)+'</span>'+
        '<span class="cl-cnt" id="cnt-'+cid+'"></span>'+
        '<span class="cl-arrow" id="arr-'+cid+'">&#9656;</span>'+
      '</button>'+
      '<div class="cl-body" id="'+cid+'" style="display:none;">'+rows+'</div>'+
    '</div>';
  }).join('');
}
function toggleCat(id){
  const b=document.getElementById(id); const a=document.getElementById('arr-'+id);
  if(b.style.display==='none'){ b.style.display='block'; a.innerHTML='&#9662;'; }
  else { b.style.display='none'; a.innerHTML='&#9656;'; }
}
function catCount(cid){
  const body=document.getElementById(cid);
  const n=body.querySelectorAll('.cl-check:checked').length;
  const badge=document.getElementById('cnt-'+cid);
  if(n>0){ badge.textContent=n; badge.classList.add('on'); }
  else{ badge.textContent=''; badge.classList.remove('on'); }
}

let activeRole = 'barista';
let sending = false;

// ============ РЕНДЕР ============

function remaindersHTML(role){
  return REMAINDERS[role].map(function(g){
    return '<div class="group-label">'+esc(g.group)+'</div>'+
      g.items.map(function(it){
        const badge = it.pid ? '<span class="pid-badge">сверка</span>' : '';

function productionHTML(role){
  return PRODUCTION[role].map(function(p){
    return '<div class="row">'+
      '<span class="row-name">'+esc(p.name)+'</span>'+

  const isBar = role==='barista';

// кнопка активна только если форма заполнена по-настоящему (имя + минимум 3 остатка)
function checkReady(role){
  const nameEl=document.getElementById(role+'-name');
  if(!nameEl) return;
  const name=nameEl.value.trim();
  let filled=0;
  document.querySelectorAll('#form-'+role+' .rem-inp').forEach(function(i){ if(i.value.trim()!=='') filled++; });
  const btn=document.getElementById(role+'-send');
  if(!btn) return;
  btn.disabled = !(name!=='' && filled>=3);
}

// ============ СПИСАНИЕ: строки ============
function woOptions(){
  return '<option value="">— выбрать блюдо —</option>'+
    WRITEOFF_DISHES.map(function(dd,idx){
      return '<option value="'+idx+'">'+esc(dd.name)+'</option>';
    }).join('');
}
function addWoRow(){
  const list=document.getElementById('wo-list');
  if(!list) return;
  const div=document.createElement('div');
  div.className='wo-row';
  div.innerHTML='<select class="wo-sel" onchange="updateSausageHint()">'+woOptions()+'</select>'+
    '<input class="wo-num" type="number" min="0" placeholder="0" oninput="updateSausageHint()">'+
    '<button class="wo-del" onclick="this.parentElement.remove();updateSausageHint()">×</button>';
  list.appendChild(div);
}
function countHotdogs(){
  let n=0;
  document.querySelectorAll('#wo-list .wo-row').forEach(function(r){
    const sel=r.querySelector('.wo-sel'); const num=r.querySelector('.wo-num');
    if(sel.value===''||!num.value) return;
    const dd=WRITEOFF_DISHES[parseInt(sel.value,10)];
    if(dd && dd.hd) n += parseInt(num.value,10)||0;
  });
  return n;
}
function countSausages(){
  let n=0;
  document.querySelectorAll('.saus-inp').forEach(function(i){ n += parseInt(i.value,10)||0; });
  return n;
}
function updateSausageHint(){
  const hint=document.getElementById('saus-hint');
  if(!hint) return;
  const hd=countHotdogs(), s=countSausages();
  if(hd===0 && s===0){ hint.textContent=''; hint.className='hint'; return; }
  if(hd===s){ hint.textContent='✅ Сосиски сходятся с хот-догами ('+hd+')'; hint.className='hint'; }
  else{ hint.textContent='⚠️ Хот-догов: '+hd+', сосисок: '+s+' — проверь'; hint.className='hint warn'; }
}

// ============ ЗАКУП ============
function addZakup(role){
  const list=document.getElementById(role+'-zakup');
  const i=document.createElement('input');
  i.className='wo-inp'; i.type='text'; i.placeholder='Что нужно купить...';
  list.appendChild(i); i.focus();
}

// ============ СБОР ДАННЫХ ============
function collect(role){
  // остатки (для отчёта) + факт для сверки
  const remainders=[]; const fact={};
  document.querySelectorAll('#form-'+role+' .rem-inp').forEach(function(i){
    const name=i.getAttribute('data-name'); const val=i.value.trim();
    remainders.push({name:name, val:(val===''?'—':val)});
    const pid=i.getAttribute('data-pid');
    if(pid && val!==''){ fact[pid]=parseFloat(val); }
  });
  // производство
  const manufacture=[]; const prodReport=[];
  document.querySelectorAll('#form-'+role+' .prod-inp').forEach(function(i){
    const num=parseInt(i.value,10)||0;
    if(num>0){
      manufacture.push({id:i.getAttribute('data-id'),type:i.getAttribute('data-type'),num:num});
      prodReport.push({name:i.getAttribute('data-name'),num:num});
    }
  });
  // списание (только бариста)
  const writeoff=[]; const woReport=[];
  if(role==='barista'){
    document.querySelectorAll('#wo-list .wo-row').forEach(function(r){
      const sel=r.querySelector('.wo-sel'); const num=parseInt(r.querySelector('.wo-num').value,10)||0;
      if(sel.value===''||num<=0) return;
      const dd=WRITEOFF_DISHES[parseInt(sel.value,10)];
      writeoff.push({id:dd.id,type:dd.type,num:num});
      woReport.push({name:dd.name,num:num});
    });
    document.querySelectorAll('.saus-inp').forEach(function(i){
      const num=parseInt(i.value,10)||0;
      if(num>0){
        writeoff.push({id:i.getAttribute('data-id'),type:'4',num:num});
        woReport.push({name:i.getAttribute('data-name')+' сосиска',num:num});
      }
    });
  }
  // закуп: отмеченные в чек-листе + вписанные вручную
  const zakup=[];
  document.querySelectorAll('#form-'+role+' .cl-check:checked').forEach(function(c){ zakup.push(c.getAttribute('data-name')); });
  document.querySelectorAll('#'+role+'-zakup input').forEach(function(i){ if(i.value.trim()) zakup.push(i.value.trim()); });

  return {
    role:role,
    name:(document.getElementById(role+'-name').value.trim()||'—'),
    date:document.getElementById(role+'-date').value,
    time:document.getElementById(role+'-time').value||'—',
    remainders:remainders, prodReport:prodReport, woReport:woReport, zakup:zakup,
    payload:{ role:role, manufacture:manufacture, writeoff:writeoff, fact:fact,
      names:{
        manufacture: prodReport.map(function(r){return r.name+' × '+r.num;}),
        writeoff: woReport.map(function(r){return r.name+' × '+r.num;})
      }
    }
  };
}

// ============ WhatsApp текст ============
function fmtDate(v){ if(!v) return '—'; const p=v.split('-'); return p[2]+'.'+p[1]+'.'+p[0]; }
function buildWA(c){
  const SEP='━━━━━━━━━━━━━━━';
  const head=c.role==='barista'?'☕ *ОТЧЁТ БАРИСТЫ — GOOD DOG*':'🌭 *ОТЧЁТ ПОВАРА — GOOD DOG*';
  let m=head+'\n👤 '+c.name+'\n📅 '+fmtDate(c.date)+' | ⏰ '+c.time+'\n'+SEP+'\n';
  m+='📦 *ОСТАТКИ НА КОНЕЦ СМЕНЫ*\n';
  c.remainders.forEach(function(r){ m+='▸ '+r.name+': '+r.val+'\n'; });
  if(c.prodReport.length){ m+=SEP+'\n'+(c.role==='barista'?'🍵':'🥗')+' *ПРОИЗВОДСТВО*\n'; c.prodReport.forEach(function(r){ m+='▸ '+r.name+': '+r.num+' шт\n'; }); }
  if(c.woReport.length){ m+=SEP+'\n🗑 *СПИСАНИЯ*\n'; c.woReport.forEach(function(r){ m+='▸ '+r.name+': '+r.num+'\n'; }); }
  if(c.zakup.length){ m+=SEP+'\n🛒 *ЗАКУП НА ЗАВТРА*\n'; c.zakup.forEach(function(z){ m+='▸ '+z+'\n'; }); }
  return m;
}

// ============ ОТПРАВКА ============
function submitReport(role){
  if(sending) return;
  const c=collect(role);
  if(c.name==='—'){ toast('Впиши имя сотрудника',true); return; }

  sending=true;
  const btn=document.getElementById(role+'-send');
  btn.disabled=true; btn.textContent='⏳ Отправка...';

  // 1) в Poster/сверку через webhook (тихо, в фоне)
  fetch(WEBHOOK_URL,{
    method:'POST',
    // no-cors: ответ не читаем, но запрос уходит. Apps Script принимает.
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(c.payload)
  }).catch(function(){/* тихо */});

  // 2) отчёт в WhatsApp
  const msg=buildWA(c);
  const url=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
    ? 'whatsapp://send?text='+encodeURIComponent(msg)
    : 'https://wa.me/?text='+encodeURIComponent(msg);

  setTimeout(function(){
    window.open(url,'_blank');
    btn.disabled=false;
    btn.innerHTML='✅ Отправлено';
    toast('Отчёт отправлен. Учёт проведётся в 22:00.');
    setTimeout(function(){ sending=false; renderForm(role); }, 1500);
  }, 400);
}

// ============ TABS / TOAST ============
function switchRole(role){
  activeRole=role;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.form').forEach(function(f){f.classList.remove('active');});
  document.getElementById('tab-'+role).classList.add('active');
  document.getElementById('form-'+role).classList.add('active');
}
function toast(msg,err){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast'+(err?' error':'');
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},3000);
}

// ============ INIT ============
renderForm('barista');
renderForm('cook');
</script>
