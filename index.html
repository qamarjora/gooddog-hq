<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#093023">
<title>Good Dog HQ</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#093023; --g2:#0d4a32; --g3:#12613f; --y:#ffcc00;
  --sheet:#ffffff; --page:#eceee9; --ink:#14160f; --mu:#7d8a82;
  --line:#eef0ec; --chip:#f4f6f2; --red:#e24b4a;
  --radius:20px; --shadow:0 10px 40px rgba(9,48,35,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Manrope',sans-serif;background:var(--g);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;}

/* ===== HERO (тёмно-зелёный верх) ===== */
.hero{background:var(--g);color:#fff;padding:22px 22px 30px;position:relative;}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--g2);display:flex;align-items:center;justify-content:center;font-size:18px;border:1.5px solid rgba(255,255,255,.14);}
.hero-icons{display:flex;gap:10px;}
.icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
.icon-btn:hover{background:rgba(255,255,255,.16);}
.hero-label{font-size:13px;color:rgba(255,255,255,.55);font-weight:500;margin-bottom:6px;}
.hero-title{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1;}
.hero-title .dot{color:var(--y);}
.hero-sub{font-size:13px;color:rgba(255,255,255,.5);margin-top:8px;}
.hero-actions{display:flex;gap:10px;margin-top:22px;}
.pill{border:none;border-radius:999px;padding:13px 22px;font-family:'Manrope',sans-serif;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .1s,background .2s;}
.pill:active{transform:scale(.97);}
.pill-primary{background:var(--y);color:var(--g);}
.pill-ghost{background:rgba(255,255,255,.10);color:#fff;}
.pill-ghost:hover{background:rgba(255,255,255,.18);}

/* ===== SHEET (белая шторка) ===== */
.sheet{background:var(--sheet);border-radius:28px 28px 0 0;margin-top:14px;min-height:70vh;padding:8px 0 120px;position:relative;box-shadow:0 -8px 30px rgba(0,0,0,.06);}
.sheet-grip{width:38px;height:5px;border-radius:3px;background:#e2e6e0;margin:12px auto 6px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 22px 14px;}
.sheet-title{font-size:19px;font-weight:800;letter-spacing:-.01em;}
.sheet-action{background:none;border:none;color:var(--mu);font-size:13px;font-weight:700;cursor:pointer;padding:6px;}

/* строки-разделы */
.rows{padding:0 12px;}
.row-item{display:flex;align-items:center;gap:14px;width:100%;background:none;border:none;padding:14px 12px;cursor:pointer;border-radius:16px;transition:background .15s;text-align:left;text-decoration:none;color:inherit;}
.row-item:hover{background:var(--chip);}
.row-chip{width:46px;height:46px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;position:relative;}
.row-chip .accent{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--y);border:2px solid var(--sheet);}
.row-main{flex:1;min-width:0;}
.row-name{font-size:15px;font-weight:700;color:var(--ink);}
.row-desc{font-size:12px;color:var(--mu);margin-top:2px;}
.row-arrow{color:#c3ccc6;font-size:22px;flex-shrink:0;}
.row-actions{display:flex;align-items:center;gap:2px;}
.mini-btn{background:none;border:none;cursor:pointer;font-size:14px;padding:7px;border-radius:9px;line-height:1;}
.mini-btn:hover{background:var(--chip);}
.mini-btn.danger:hover{background:#fdecec;}


.row-item.soon{opacity:.5;cursor:default;pointer-events:none;}
.row-soon{font-size:11px;font-weight:700;color:var(--mu);background:var(--chip);border-radius:999px;padding:3px 10px;flex-shrink:0;}

/* пустое состояние */
.empty{text-align:center;padding:54px 24px;color:var(--mu);}
.empty .e-ic{font-size:44px;opacity:.3;margin-bottom:12px;}
.empty p{font-size:14px;}

/* ===== SECTION / CARD VIEW ===== */
.subhero{background:var(--g);color:#fff;padding:18px 22px 26px;}
.subhero-top{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.chev-back{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.chev-back:hover{background:rgba(255,255,255,.16);}
.subhero-title{font-size:26px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;}
.subhero-add{margin-left:auto;background:var(--y);color:var(--g);border:none;border-radius:999px;padding:10px 16px;font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}

.card-body{background:var(--sheet);border-radius:28px 28px 0 0;margin-top:14px;min-height:70vh;padding:22px 22px 120px;line-height:1.7;font-size:14.5px;color:var(--ink);}
.card-body h3{font-size:15px;font-weight:800;color:var(--g);margin:20px 0 8px;}
.card-body h3:first-child{margin-top:0;}
.card-body p{margin-bottom:8px;}
.card-body ul,.card-body ol{padding-left:20px;margin-bottom:8px;}
.card-body li{margin-bottom:4px;}
.card-body table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px;border-radius:12px;overflow:hidden;}
.card-body th{background:var(--g);color:#fff;padding:9px 12px;text-align:left;font-weight:700;font-size:12px;}
.card-body td{padding:9px 12px;border-bottom:1px solid var(--line);}
.card-body tr:last-child td{border-bottom:none;}
.card-body tr:nth-child(even) td{background:var(--chip);}
.card-tools{display:flex;gap:8px;margin-bottom:16px;}
.tool{border:none;border-radius:999px;padding:9px 16px;font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.tool-edit{background:var(--chip);color:var(--ink);}
.tool-del{background:#fdecec;color:#d23b3a;}

/* ===== BOTTOM NAV ===== */
.nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--g);border-radius:999px;padding:7px;display:flex;gap:4px;box-shadow:0 8px 30px rgba(9,48,35,.35);z-index:80;}
.nav-btn{width:52px;height:46px;border-radius:999px;background:none;border:none;color:rgba(255,255,255,.55);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:all .2s;}
.nav-btn.active{background:#fff;color:var(--g);}
.nav-btn:not(.active):hover{color:#fff;}

/* ===== MODALS ===== */
.overlay{display:none;position:fixed;inset:0;background:rgba(9,48,35,.45);z-index:200;align-items:flex-end;justify-content:center;}
.overlay.active{display:flex;}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:24px 22px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:92vh;overflow-y:auto;animation:up .25s ease;}
@keyframes up{from{transform:translateY(30px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
.modal.wide{max-width:640px;}
.modal-grip{width:38px;height:5px;border-radius:3px;background:#e2e6e0;margin:0 auto 18px;}
.modal h2{font-size:19px;font-weight:800;margin-bottom:18px;letter-spacing:-.01em;}
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:7px;}
.fg input,.fg textarea{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;font-family:'Manrope',sans-serif;font-size:15px;color:var(--ink);outline:none;background:var(--chip);transition:border-color .2s,background .2s;}
.fg input:focus,.fg textarea:focus{border-color:var(--g);background:#fff;}
.fg textarea{min-height:220px;resize:vertical;line-height:1.6;}
.fhint{font-size:12px;color:var(--mu);margin-top:6px;line-height:1.4;}
.settings-sec{background:var(--chip);border-radius:16px;padding:16px;margin-bottom:14px;}
.settings-sec h3{font-size:13px;font-weight:800;color:var(--mu);margin-bottom:12px;}
.modal-actions{display:flex;gap:10px;margin-top:8px;}
.btn{flex:1;border:none;border-radius:14px;padding:14px;font-family:'Manrope',sans-serif;font-size:15px;font-weight:700;cursor:pointer;}
.btn-cancel{background:var(--chip);color:var(--ink);}
.btn-save{background:var(--g);color:#fff;}
.btn-save:hover{background:var(--g2);}
.btn-danger{background:#e24b4a;color:#fff;}

/* ===== SAVE BAR / TOAST ===== */
.savebar{display:none;position:fixed;bottom:78px;left:50%;transform:translateX(-50%);z-index:85;}
.savebar.visible{display:block;}
.btn-github{background:var(--y);color:var(--g);border:none;padding:13px 22px;border-radius:999px;font-family:'Manrope',sans-serif;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(9,48,35,.3);display:flex;align-items:center;gap:8px;}
.btn-github:disabled{opacity:.6;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--g);color:#fff;padding:13px 20px;border-radius:14px;font-size:14px;font-weight:600;z-index:300;transition:transform .3s;max-width:90%;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.error{background:var(--red);}

@media(min-width:560px){ body{background:var(--page);} .wrap{max-width:520px;margin:0 auto;background:var(--g);min-height:100vh;} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="savebar" id="saveBar">
  <button class="btn-github" id="btnGithubSave" onclick="saveToGithub()">☁️ Опубликовать для сотрудников</button>
</div>
<div class="toast" id="toast"></div>

<!-- Login -->
<div class="overlay" id="loginModal">
  <div class="modal">
    <div class="modal-grip"></div>
    <h2>Вход для редактора</h2>
    <div class="fg"><label>Пароль</label>
      <input type="password" id="loginPassword" placeholder="Введи пароль" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal('loginModal')">Отмена</button>
      <button class="btn btn-save" onclick="doLogin()">Войти</button>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-grip"></div>
    <h2>Настройки</h2>
    <div class="settings-sec">
      <h3>GITHUB</h3>
      <div class="fg"><label>Personal Access Token</label>
        <input type="password" id="githubToken" placeholder="ghp_...">
        <p class="fhint">Хранится только в этом браузере. Нужен для публикации изменений.</p></div>
      <div class="fg"><label>Репозиторий</label>
        <input type="text" id="githubRepo" placeholder="qamarjora/gooddog-hq"></div>
    </div>
    <div class="settings-sec">
      <h3>БЕЗОПАСНОСТЬ</h3>
      <div class="fg"><label>Новый пароль редактора</label>
        <input type="password" id="editorPassword" placeholder="Оставь пустым чтобы не менять"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal('settingsModal')">Отмена</button>
      <button class="btn btn-save" onclick="saveSettings()">Сохранить</button>
    </div>
  </div>
</div>

<!-- Card editor -->
<div class="overlay" id="cardModal">
  <div class="modal wide">
    <div class="modal-grip"></div>
    <h2 id="cardModalTitle">Новая карточка</h2>
    <div class="fg"><label>Название</label>
      <input type="text" id="cardName" placeholder="Например: Хот-дог классик"></div>
    <div class="fg"><label>Содержимое</label>
      <textarea id="cardContent" placeholder="Текст карточки..."></textarea>
      <p class="fhint">## Заголовок · **жирный** · - список · таблица: | Колонка 1 | Колонка 2 |</p></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal('cardModal')">Отмена</button>
      <button class="btn btn-save" onclick="saveCard()">Сохранить</button>
    </div>
  </div>
</div>

<!-- Confirm delete -->
<div class="overlay" id="confirmModal">
  <div class="modal">
    <div class="modal-grip"></div>
    <h2>Удалить карточку?</h2>
    <p style="color:var(--mu);font-size:14px;margin-bottom:20px;">Это действие нельзя отменить.</p>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal('confirmModal')">Отмена</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Удалить</button>
    </div>
  </div>
</div>

<script>
// ===== CONSTANTS =====
const PASS_KEY='gd_pass', TOKEN_KEY='gd_token', REPO_KEY='gd_repo', DATA_KEY='gd_data';
const DEFAULT_DATA={ sections:[
  { id:'shift',     title:'Учёт смены', icon:'📦', desc:'Остатки, производство, закуп', type:'shift', cards:[] },
  { id:'tech',      title:'Тех карты',  icon:'📋', desc:'Все блюда и напитки',          type:'cards', cards:[] },
  { id:'standards', title:'Стандарты',  icon:'✅', desc:'Обязанности и роли',           type:'cards', cards:[] },
  { id:'regs',      title:'Регламенты', icon:'📌', desc:'Открытие, закрытие, уборка',   type:'cards', cards:[] }
]};

// разделы, которые пока не открываются (приглушены, «скоро»)
const DISABLED_SECTIONS = ['regs'];

let currentSection=null, currentCard=null, pendingDeleteId=null, editingCardId=null;

// ===== DATA =====
function getData(){ try{const r=localStorage.getItem(DATA_KEY);return r?JSON.parse(r):clone(DEFAULT_DATA);}catch{return clone(DEFAULT_DATA);} }
function setData(d){ localStorage.setItem(DATA_KEY,JSON.stringify(d)); document.getElementById('saveBar').classList.add('visible'); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function getSetting(k,d=''){ return localStorage.getItem(k)||d; }
function getPassword(){ return getSetting(PASS_KEY,'Good2020'); }
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function todayStr(){ return new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}); }

// ===== NAV =====
function goHome(){ currentSection=null; currentCard=null; renderHome(); }
function openSection(id){ if(DISABLED_SECTIONS.includes(id)) return; const d=getData(); currentSection=d.sections.find(s=>s.id===id); currentCard=null; renderSection(); }
function openCard(id){ const d=getData(); const sec=d.sections.find(s=>s.id===currentSection.id); currentCard=sec.cards.find(c=>c.id===id); renderCard(); }
function canEdit(){ return !!(currentSection && currentSection.type==='cards'); }

// ===== HOME =====
function renderHome(){
  const d=getData();
  const list=d.sections.filter(s=>s.id!=='shift');   // «Учёт смены» скрыт — заменён на «Закрытие смены»
  document.getElementById('app').innerHTML=`
    <div class="hero">
      <div class="hero-top">
        <div class="avatar">🌭</div>
        <div class="hero-icons">
          <button class="icon-btn" onclick="openSettingsModal()">⚙️</button>
        </div>
      </div>
      <div class="hero-label">${todayStr()}</div>
      <div class="hero-title">Good Dog <span class="dot">HQ</span></div>
      <div class="hero-sub">Стандарты, рецепты и операционные процессы</div>
      <div class="hero-actions">
        <a class="pill pill-primary" href="zakrytie.html">🌙 Закрытие смены</a>
        <button class="pill pill-ghost" onclick="openSection('tech')">Тех карты</button>
      </div>
    </div>
    <div class="sheet">
      <div class="sheet-grip"></div>
      <div class="sheet-head"><div class="sheet-title">Разделы</div></div>
      <div class="rows">
        ${list.map(s=>{
          const soon = DISABLED_SECTIONS.includes(s.id);
          return `
          <button class="row-item ${soon?'soon':''}" ${soon?'':`onclick="openSection('${s.id}')"`}>
            <div class="row-chip">${s.icon}<span class="accent"></span></div>
            <div class="row-main"><div class="row-name">${s.title}</div><div class="row-desc">${s.desc}</div></div>
            ${soon?'<span class="row-soon">скоро</span>':'<span class="row-arrow">›</span>'}
          </button>`;}).join('')}
      </div>
    </div>
    ${bottomNav('home')}`;
}

// ===== SECTION =====
function renderSection(){
  const s=currentSection;
  if(s.type==='shift'){ goHome(); return; }   // старый учёт смены отключён
  const edit=canEdit();
  const cards=s.cards||[];
  const listHTML = cards.length===0
    ? `<div class="empty"><div class="e-ic">${s.icon}</div><p>${edit?'Пока пусто. Нажми «+ Добавить».':'Пока ничего нет.'}</p></div>`
    : `<div class="rows">${cards.map(c=>`
        <button class="row-item" onclick="openCard('${c.id}')">
          <div class="row-chip">${s.icon}<span class="accent"></span></div>
          <div class="row-main"><div class="row-name">${esc(c.name)}</div></div>
          <div class="row-actions">
            ${edit?`<button class="mini-btn" onclick="event.stopPropagation();openCardModal('${c.id}')">✏️</button>
            <button class="mini-btn danger" onclick="event.stopPropagation();askDelete('${c.id}')">🗑️</button>`:''}
            <span class="row-arrow">›</span>
          </div>
        </button>`).join('')}</div>`;
  document.getElementById('app').innerHTML=`
    <div class="subhero">
      <div class="subhero-top">
        <button class="chev-back" onclick="goHome()">‹</button>
        <div class="subhero-title">${s.icon} ${s.title}</div>
        ${edit?`<button class="subhero-add" onclick="openCardModal()">+ Добавить</button>`:''}
      </div>
    </div>
    <div class="card-body" style="padding-top:8px;">${listHTML}</div>
    ${bottomNav('')}`;
}

// ===== CARD =====
function renderCard(){
  const c=currentCard;
  const tools=canEdit()?`
    <div class="card-tools">
      <button class="tool tool-edit" onclick="openCardModal('${c.id}')">✏️ Редактировать</button>
      <button class="tool tool-del" onclick="askDelete('${c.id}')">🗑️ Удалить</button>
    </div>`:'';
  document.getElementById('app').innerHTML=`
    <div class="subhero">
      <div class="subhero-top">
        <button class="chev-back" onclick="renderSection()">‹</button>
        <div class="subhero-title">${esc(c.name)}</div>
      </div>
    </div>
    <div class="card-body">${tools}${parseContent(c.content)}</div>
    ${bottomNav('')}`;
}

// ===== BOTTOM NAV =====
function bottomNav(active){
  return `<div class="nav">
    <button class="nav-btn ${active==='home'?'active':''}" onclick="goHome()">🏠</button>
    <a class="nav-btn" href="zakrytie.html">🌙</a>
    <button class="nav-btn" onclick="openSettingsModal()">⚙️</button>
  </div>`;
}

// ===== MARKDOWN =====
function parseContent(text){
  if(!text) return '<p>Пусто</p>';
  const lines=text.split('\n'); let html='',inTable=false,inList=false,tableRows=[];
  for(let i=0;i<lines.length;i++){ let line=lines[i];
    if(line.trim().startsWith('|')){ if(!inTable){inTable=true;tableRows=[];} tableRows.push(line.trim()); continue; }
    else if(inTable){ html+=renderTable(tableRows); inTable=false; tableRows=[]; }
    if(line.startsWith('## ')){ if(inList){html+='</ul>';inList=false;} html+=`<h3>${esc(line.slice(3))}</h3>`; continue; }
    if(line.startsWith('- ')){ if(!inList){html+='<ul>';inList=true;} html+=`<li>${inlineFmt(line.slice(2))}</li>`; continue; }
    else if(inList){ html+='</ul>'; inList=false; }
    if(/^\d+\.\s/.test(line)){ html+=`<li>${inlineFmt(line.replace(/^\d+\.\s/,''))}</li>`; continue; }
    if(line.trim()==='') continue;
    html+=`<p>${inlineFmt(line)}</p>`;
  }
  if(inTable) html+=renderTable(tableRows);
  if(inList) html+='</ul>';
  return html;
}
function renderTable(rows){
  const f=rows.filter(r=>!r.match(/^\|[-|\s]+\|$/)); if(!f.length) return '';
  let h='<table>';
  f.forEach((row,i)=>{ const cells=row.split('|').filter((_,idx,arr)=>idx>0&&idx<arr.length-1);
    const t=i===0?'th':'td'; h+='<tr>'+cells.map(c=>`<${t}>${esc(c.trim())}</${t}>`).join('')+'</tr>'; });
  return h+'</table>';
}
function inlineFmt(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>'); }

// ===== AUTH =====
function openLoginModal(){ document.getElementById('loginPassword').value=''; document.getElementById('loginModal').classList.add('active'); setTimeout(()=>document.getElementById('loginPassword').focus(),100); }
function doLogin(){ const p=document.getElementById('loginPassword').value; if(p===getPassword()){ closeModal('loginModal'); if(currentSection)renderSection(); else renderHome(); showToast('Вы вошли как редактор'); } else showToast('Неверный пароль',true); }

// ===== SETTINGS =====
function openSettingsModal(){ document.getElementById('githubToken').value=getSetting(TOKEN_KEY); document.getElementById('githubRepo').value=getSetting(REPO_KEY,'qamarjora/gooddog-hq'); document.getElementById('editorPassword').value=''; document.getElementById('settingsModal').classList.add('active'); }
function saveSettings(){ const t=document.getElementById('githubToken').value.trim(),r=document.getElementById('githubRepo').value.trim(),p=document.getElementById('editorPassword').value; if(t)localStorage.setItem(TOKEN_KEY,t); if(r)localStorage.setItem(REPO_KEY,r); if(p)localStorage.setItem(PASS_KEY,p); closeModal('settingsModal'); showToast('Настройки сохранены'); }

// ===== CARD CRUD =====
function openCardModal(id=null){ editingCardId=id; document.getElementById('cardModalTitle').textContent=id?'Редактировать':'Новая карточка';
  if(id){ const d=getData(); const sec=d.sections.find(s=>s.id===currentSection.id); const c=sec.cards.find(x=>x.id===id); document.getElementById('cardName').value=c.name; document.getElementById('cardContent').value=c.content; }
  else { document.getElementById('cardName').value=''; document.getElementById('cardContent').value=''; }
  document.getElementById('cardModal').classList.add('active'); setTimeout(()=>document.getElementById('cardName').focus(),100); }
function saveCard(){ const name=document.getElementById('cardName').value.trim(),content=document.getElementById('cardContent').value.trim();
  if(!name){ showToast('Введи название',true); return; }
  const d=getData(); const sec=d.sections.find(s=>s.id===currentSection.id);
  if(editingCardId){ const c=sec.cards.find(x=>x.id===editingCardId); c.name=name; c.content=content; c.updatedAt=new Date().toISOString(); }
  else sec.cards.push({id:'card_'+Date.now(),name,content,createdAt:new Date().toISOString()});
  setData(d); currentSection=sec; closeModal('cardModal'); renderSection(); showToast(editingCardId?'Карточка обновлена':'Карточка добавлена'); }
function askDelete(id){ pendingDeleteId=id; document.getElementById('confirmModal').classList.add('active'); }
function confirmDelete(){ const d=getData(); const sec=d.sections.find(s=>s.id===currentSection.id); sec.cards=sec.cards.filter(c=>c.id!==pendingDeleteId); setData(d); currentSection=sec; closeModal('confirmModal'); if(currentCard&&currentCard.id===pendingDeleteId)currentCard=null; renderSection(); showToast('Карточка удалена'); }

// ===== GITHUB =====
async function saveToGithub(){
  const token=getSetting(TOKEN_KEY),repo=getSetting(REPO_KEY,'qamarjora/gooddog-hq');
  if(!token){ showToast('Укажи GitHub токен в настройках ⚙️',true); openSettingsModal(); return; }
  const btn=document.getElementById('btnGithubSave'); btn.disabled=true; btn.textContent='⏳ Публикуется...';
  try{
    const data=getData(); const content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)))); let sha=null;
    const g=await fetch(`https://api.github.com/repos/${repo}/contents/data.json`,{headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json'}});
    if(g.ok){ sha=(await g.json()).sha; }
    const put=await fetch(`https://api.github.com/repos/${repo}/contents/data.json`,{method:'PUT',headers:{'Authorization':`token ${token}`,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify({message:`Update ${new Date().toLocaleDateString('ru-RU')}`,content,...(sha?{sha}:{})})});
    if(put.ok){ document.getElementById('saveBar').classList.remove('visible'); showToast('✅ Опубликовано для сотрудников'); }
    else { const e=await put.json(); showToast('Ошибка: '+(e.message||'GitHub API'),true); }
  }catch{ showToast('Ошибка соединения',true); }
  finally{ btn.disabled=false; btn.textContent='☁️ Опубликовать для сотрудников'; }
}

// ===== HELPERS =====
function closeModal(id){ document.getElementById(id).classList.remove('active'); }
function showToast(msg,err=false){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast'+(err?' error':''); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); }
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('active'); }));

// секретный вход редактора — долгий тап по аватару/лого (5 сек не нужно; тап по дате 5 раз)
let tapCount=0,tapTimer=null;
document.addEventListener('click',e=>{ if(e.target.classList&&e.target.classList.contains('hero-label')){ tapCount++; clearTimeout(tapTimer); tapTimer=setTimeout(()=>tapCount=0,1500); if(tapCount>=5){ tapCount=0; openLoginModal(); } } });

// ===== LOAD =====
async function loadFromGithub(){
  const repo=getSetting(REPO_KEY,'qamarjora/gooddog-hq');
  try{ const res=await fetch(`https://api.github.com/repos/${repo}/contents/data.json`,{headers:{'Accept':'application/vnd.github.v3+json'}});
    if(res.ok){ const j=await res.json(); const dec=decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))); localStorage.setItem(DATA_KEY,JSON.stringify(JSON.parse(dec))); }
  }catch{}
  renderHome();
}
loadFromGithub();
</script>
